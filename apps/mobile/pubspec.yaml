# PURPOSE: Declare the ChartApp application — the top-level Flutter target that composes the
#          UI package, the domain, persistence and ink into a runnable app on Android, iOS,
#          Linux and Windows.
# INPUTS: None. Resolved as a member of the root pub workspace.
# OUTPUTS: The `chartapp` application. Listing every workspace package as a dependency is
#          deliberate: it makes the whole dependency graph resolve in CI, so a package that
#          cannot resolve fails here rather than at the moment a feature first imports it.
# KEYWORDS: app, flutter, android, ios, linux, windows, composition-root, phase-0
name: chartapp
description: >-
  ChartApp: a mobile-first chord-chart editor with native handwriting. Android, iOS, Linux and
  Windows targets from one codebase.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  chart_core: any
  chart_ui: any
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  ink_native: any
  storage_drift: any
  telemetry: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
