# PURPOSE: Declare the ChartApp application — the top-level Flutter target that composes the
#          UI package, the domain, persistence and ink into a runnable app on web, Android, iOS,
#          Linux and Windows.
# INPUTS: None. Resolved as a member of the root pub workspace.
# OUTPUTS: The `chartapp` application. Listing every workspace package as a dependency is
#          deliberate: it makes the whole dependency graph resolve in CI, so a package that
#          cannot resolve fails here rather than at the moment a feature first imports it.
#          A declared dependency is not a compiled one: `storage_drift` is listed here for that
#          resolution check, and the web entrypoint never imports it, so its native SQLite build
#          hook stays off the web path (owner decision D20, see apps/mobile/web/).
# KEYWORDS: app, flutter, web, android, ios, linux, windows, composition-root, phase-0
name: chartapp
description: >-
  ChartApp: a mobile-first chord-chart editor with native handwriting. Web, Android, iOS, Linux
  and Windows targets from one codebase.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  chart_core: any
  chart_ui: any
  cupertino_icons: ^1.0.8
  # WHY THIS ONE, AND WHAT IT COSTS. The application cannot perform its primary function on the
  # owner's tablet without a native file chooser: Android scoped storage makes another app's
  # `Documents`/`Downloads` unreadable, the manifest declares no storage permission, and the
  # absolute path of one's own document is not something a musician knows. `file_selector` is the
  # Flutter team's own federated plugin, in the same `flutter/packages` repository as
  # `flutter_localizations`, and it is the canonical route to each platform's own file dialog:
  # `ACTION_OPEN_DOCUMENT` on Android, `IFileDialog` on Windows, the portal/GTK dialog on Linux,
  # from one Dart API. Reimplementing that per platform would be a hand-written channel repeated
  # three times and maintained here for ever.
  #
  # The cost, named rather than implied: the umbrella depends on one endorsed implementation per
  # platform, so the WEB bundle gains `file_selector_web` in its generated plugin registrant even
  # though no web code path calls it, and the APK gains the plugin's Kotlin and its registrant
  # entry. Both numbers are measured and recorded in `docs/sdd.md` A55.
  #
  # WHAT IT DELIBERATELY DOES NOT DO. `getSaveLocation` is documented unsupported on Android and
  # iOS (its README's feature table; flutter/flutter#168318, where a maintainer confirms the Android
  # answer is a `content://` URI that `dart:io` cannot write). Saving a `.chart` or a `.setlist` on
  # Android therefore goes through this application's own `ACTION_CREATE_DOCUMENT` channel — see
  # `android/app/src/main/kotlin/com/chartapp/chartapp/MainActivity.kt` — instead of a second
  # dependency.
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  # WHY THESE TWO, AND WHAT THEY COST. The interface is switchable between English and Russian at
  # runtime, and Russian selects among THREE plural forms ("1 такт", "2 такта", "5 тактов") with a
  # rule that also counts 11-14 as the "many" form ("11 тактов", not "11 такт") — the exact class of
  # bug a hand-written rule gets wrong for a year. `intl` carries the CLDR plural rules
  # (`lib/src/plural_rules.dart` is generated from ICU data by the Dart team and maps `ru` to the
  # one/few/many rule), and `flutter_localizations` localizes the framework's OWN strings — the
  # drawer's semantic label, a popup menu's default tooltip, dialog buttons — which a translation
  # of this application's own text cannot reach.
  #
  # The cost, stated rather than implied: `flutter_localizations` is an SDK package, so it adds no
  # third-party code and no version to keep current; `intl` is the Dart team's own package and was
  # ALREADY in the resolved graph as a dependency of `flutter_localizations`, so declaring it adds
  # a name, not a download. What is genuinely added is CLDR data in the bundle and a
  # code-generation step (`flutter gen-l10n`, see `l10n.yaml`), whose output is committed so
  # `melos run verify` stays one command. The measured size of both is recorded in `docs/sdd.md`.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  ink_native: any
  storage_drift: any
  telemetry: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
  # Turns on the localization build step, whose configuration lives in `l10n.yaml`. The GENERATED
  # classes are committed under `lib/l10n/`, so this flag is what tells the toolchain the directory
  # is generated rather than hand-written; nothing about it runs at application runtime.
  generate: true
