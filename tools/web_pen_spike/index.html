<!DOCTYPE html>
<!--
  PURPOSE: Measure what a BROWSER actually delivers for stylus and finger input, so the decision to
           distribute as a web page can rest on a number instead of on an assumption. It measures
           the raw Pointer Events API on purpose, with no framework in between: a framework maps,
           coalesces or drops events before application code sees them, and the ceiling belongs to
           the browser, not to the framework.

  INPUTS: A touch-capable browser. Open the page over HTTP from this machine. Draw in the canvas
          with an Apple Pencil, an S Pen, or a finger.

  OUTPUTS: Live counters on screen and one JSON object per stroke in the log panel, plus the same
           lines on the console. The numbers that decide the architecture are:
             - samplesPerStroke and coalescedPerEvent: whether the digitizer's high-rate stream
               survives to the page, or arrives as a coarse polyline;
             - pressureDistinct and tiltDistinct: whether those axes are real or constant;
             - paintLatencyP95Ms: input timestamp to the end of the frame that drew it;
             - palmRejectedByProximity and penGapP50/P95/P99: how the pen-proximity palm rule
               behaves, and the gaps the proximity window must be chosen from;
             - touchWidthsSeen and penWidthsSeen, which are reported precisely because they are
               the evidence that a WIDTH rule cannot work here.

  KEYWORDS: spike, pointer-events, stylus, apple-pencil, s-pen, coalesced, latency, palm, web
  NOT PART OF THE PRODUCT. A diagnostic, like tool/probe_ireal.dart.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Web pen spike — what does the browser deliver?</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1622; color: #e6edf3;
               font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 12px; background: #12233a; display: flex; gap: 16px; flex-wrap: wrap;
           align-items: center; }
  header b { color: #ffc857; }
  #surface { flex: 1; position: relative; background: #fdfdfb; touch-action: none;
             user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  footer { padding: 8px 12px; background: #12233a; display: flex; gap: 12px; flex-wrap: wrap;
           align-items: flex-start; height: 30vh; overflow: auto; }
  /* A FIXED height, not a maximum. A footer that grows with its content resizes the drawing surface
     above it, and every resize of that surface is a resize of the canvas — which is where the ink
     lives. The log scrolls inside this box instead of pushing the layout around. */
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #2e5d8a;
           background: #1b3554; color: #e6edf3; }
  button.primary { background: #2e5d8a; }
  #log { white-space: pre-wrap; word-break: break-all; color: #9fb3c8; }
  .ok { color: #7ee787; } .warn { color: #ffc857; } .bad { color: #ff7b72; }
</style>
</head>
<body>
<header>
  <span><b>Web pen spike</b></span>
  <span id="ua"></span>
  <span>strokes <b id="strokes">0</b></span>
  <span>samples <b id="samples">0</b></span>
  <span>samples/stroke <b id="perStroke">0</b></span>
  <span>coalesced/event <b id="coalesced">0</b></span>
  <span>paint p95 <b id="p95">–</b> ms</span>
</header>

<div id="surface"><canvas id="canvas"></canvas></div>

<footer>
  <button class="primary" id="copy">Copy JSON</button>
  <button id="download">Download JSON</button>
  <button id="clear">Clear</button>
  <span id="hint">Draw with the pen first, then with a finger. Rest a palm on the glass while drawing with the pen.</span>
  <div id="log"></div>
</footer>

<script>
'use strict';

// ---------------------------------------------------------------------------------------------
// The palm rule. It uses TWO signals, because two runs showed that both exist and that neither is
// enough on its own.
//
// RUN 1 — a pen was in play (1263 pen samples, 215 hover events). Every touch width was between 1
// and 8. NO wide contact reached the page at all, and this page first concluded from that run that
// the browser reports no contact geometry and that a width rule was therefore impossible. That
// conclusion was WRONG, and it was wrong because one run was treated as the whole truth.
//
// RUN 2 — no pen at all (penSeen 0, penSamples 0). Touch widths were 2,3,4,6,7 AND 71, 87. So the
// browser does report contact width, and a palm reports the same order of magnitude it does on
// Android (86-91 there). The two populations are 1-8 against 71-87, which is a wide separation.
//
// WHAT IS STILL UNKNOWN, and must not be papered over: run 1's missing wide contacts have two
// possible causes that these numbers CANNOT distinguish — either no palm was resting on the glass,
// or the platform suppressed the palm while the pen was active. Settling that needs a run that
// deliberately rests a palm WHILE the pen is drawing.
//
// So the rule takes both signals:
//   * a pen seen within the window  -> ignore the touch  (the writing case, and the one the hover
//     events make detectable);
//   * otherwise a wide touch        -> ignore it too     (a palm with no pen in play).
// Both thresholds and the window are named, published in the summary, and every rejection records
// WHICH signal fired, so a future run can tell the two cases apart instead of re-deciding which one
// the rule was really resting on.
const STYLUS_PROXIMITY_WINDOW_MS = 1000;
const PALM_WIDTH_PX = 40.0;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { desynchronized: true });
const el = (id) => document.getElementById(id);

const stats = {
  strokes: 0, samples: 0, coalescedEvents: 0, rawEvents: 0,
  latencies: [], pressureValues: new Set(), tiltValues: new Set(),
  penSamples: 0, touchSamples: 0, mouseSamples: 0,
  palmRejectedByProximity: 0, palmRejectedByWidth: 0, touchAdmitted: 0,
  penSeen: 0, penGaps: [],
  widthsSeenTouch: new Set(), widthsSeenPen: new Set(),
  coalescedUnavailable: false, hoverSeen: 0,
};
const strokeLog = [];
let lastStylusSeenMs = -Infinity;

function devicePixelRatioSafe() { return window.devicePixelRatio || 1; }

// The canvas rectangle in CLIENT coordinates, refreshed whenever the layout can have changed.
// Positions are derived from `clientX/clientY` against this rectangle rather than from
// `offsetX/offsetY`, and that is not a style preference: `offsetX` is measured against the event's
// TARGET, and `setPointerCapture` retargets pointer events from the canvas to the surface wrapper.
// With the target changing mid-stroke, `offsetX` starts being measured from a different element's
// origin, and the ink lands displaced by the constant distance between the two origins — which is
// exactly the bug this replaced.
let canvasRect = { left: 0, top: 0 };

function resize() {
  const r = el('surface').getBoundingClientRect();
  const dpr = devicePixelRatioSafe();
  const width = Math.round(r.width * dpr);
  const height = Math.round(r.height * dpr);
  canvasRect = canvas.getBoundingClientRect();
  if (canvas.width === width && canvas.height === height) {
    return;
  }
  // Assigning to canvas.width or canvas.height RESETS the bitmap, so a resize that carries no size
  // change is skipped above and a real one copies the drawing across. Without this, every layout
  // change wiped the page — and the layout changed on every stroke, because the log line added at
  // the end of each stroke grew the footer and shrank the surface. The ink appeared to jump and
  // vanish while the pen was still down.
  const previous = document.createElement('canvas');
  previous.width = canvas.width;
  previous.height = canvas.height;
  if (canvas.width > 0 && canvas.height > 0) {
    previous.getContext('2d').drawImage(canvas, 0, 0);
  }
  canvas.width = width;
  canvas.height = height;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (previous.width > 0 && previous.height > 0) {
    // The old bitmap is in old device pixels; draw it into the new CSS-pixel space so the strokes
    // stay where the musician put them, scaled rather than displaced.
    ctx.drawImage(previous, 0, 0, previous.width / dpr, previous.height / dpr);
  }
}

// The surface is a flex child between two bars, and the top bar's height changes as the counters
// fill in and the user-agent string wraps. A `window.resize` listener never fires for that, so the
// backing store would keep the old height while the element took a new one, the browser would scale
// the bitmap to fit, and every stroke would be drawn at the wrong place by an amount that grows
// with distance. A ResizeObserver is the thing that actually tracks a layout change.
function observeSurface() {
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(() => resize()).observe(el('surface'));
  }
}

window.addEventListener('resize', resize);
window.addEventListener('scroll', resize, { passive: true });

// The position of an event in the canvas's own CSS-pixel space.
function pointOf(e) {
  return { x: e.clientX - canvasRect.left, y: e.clientY - canvasRect.top };
}

el('ua').textContent = navigator.userAgent;

// ---------------------------------------------------------------------------------------------
// Latency: the timestamp of a sample, against the moment the frame that drew it finished. This is
// a LOWER BOUND and the page says so — there is no browser API for the moment a frame is presented
// on glass, which is exactly the API our Android surface had to work around too. What it does
// measure honestly is input-to-our-paint.
let pendingLatency = [];
function flushLatency() {
  if (pendingLatency.length === 0) return;
  const painted = performance.now();
  for (const t of pendingLatency) stats.latencies.push(painted - t);
  pendingLatency = [];
  render();
}

function percentile(sorted, p) {
  if (sorted.length === 0) return null;
  const i = Math.min(sorted.length - 1, Math.ceil((p / 100) * sorted.length) - 1);
  return sorted[Math.max(0, i)];
}

function render() {
  el('strokes').textContent = stats.strokes;
  el('samples').textContent = stats.samples;
  el('perStroke').textContent = stats.strokes ? Math.round(stats.samples / stats.strokes) : 0;
  el('coalesced').textContent = stats.rawEvents
    ? (stats.coalescedEvents / stats.rawEvents).toFixed(2) : 0;
  const sorted = stats.latencies.slice().sort((a, b) => a - b);
  const p95 = percentile(sorted, 95);
  el('p95').textContent = p95 === null ? '–' : p95.toFixed(1);
}

// ---------------------------------------------------------------------------------------------
// Drawing. Every sample the browser offers is drawn, coalesced ones included: dropping them would
// change the very thing being measured, and a coarse polyline is exactly the failure this spike
// exists to detect.
let drawing = false;
let current = null;

function beginStroke(e) {
  drawing = true;
  current = {
    pointerType: e.pointerType, id: e.pointerId,
    samples: 0, coalesced: 0, events: 0,
    pressureDistinct: new Set(), tiltDistinct: new Set(),
    widths: new Set(), startMs: e.timeStamp, admitted: true,
  };
  ctx.beginPath();
  ctx.lineWidth = 3;
  ctx.strokeStyle = e.pointerType === 'pen' ? '#102a43' : '#b04a5a';
  const p = pointOf(e);
  ctx.moveTo(p.x, p.y);
}

function addSample(e, sample) {
  current.samples++;
  stats.samples++;
  pendingLatency.push(sample.timeStamp);
  // Both the aggregate and the per-stroke set are kept: the aggregate answers "is this axis real at
  // all on this device", the per-stroke set answers "was it real for THIS stroke", and a constant
  // pressure in one stroke can hide a working axis in another.
  const pressure = Math.round(sample.pressure * 100) / 100;
  const tilt = Math.round((sample.tiltX || 0) / 5) * 5;
  stats.pressureValues.add(pressure);
  stats.tiltValues.add(tilt);
  current.pressureDistinct.add(pressure);
  current.tiltDistinct.add(tilt);
  const width = Math.round(sample.width || 0);
  current.widths.add(width);
  if (sample.width) {
    if (e.pointerType === 'touch') stats.widthsSeenTouch.add(width);
    else stats.widthsSeenPen.add(width);
  }
  ctx.lineTo(pointOf(sample).x, pointOf(sample).y);
}

// Palm rule: two signals. See the long note above the constants.
function decideAdmission(e) {
  if (e.pointerType !== 'touch') return { admit: true, reason: 'not-a-touch' };
  const penInPlay = (e.timeStamp - lastStylusSeenMs) <= STYLUS_PROXIMITY_WINDOW_MS;
  if (penInPlay) return { admit: false, reason: 'pen-near' };
  if ((e.width || 0) >= PALM_WIDTH_PX) return { admit: false, reason: 'width-wide' };
  return { admit: true, reason: 'finger' };
}

// The gaps between consecutive pen events. This is what the proximity window must be chosen from:
// it has to exceed the real pause between a pen's own strokes, or the gate opens mid-writing.
function notePenEvent(timeStamp) {
  if (lastStylusSeenMs > -Infinity) {
    const gap = timeStamp - lastStylusSeenMs;
    if (gap > 0) stats.penGaps.push(gap);
  }
  lastStylusSeenMs = timeStamp;
  stats.penSeen++;
}

el('surface').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  // Capture keeps a stroke alive when the pen leaves the surface. It throws for a synthetic or
  // already-released pointer, and an exception here would abort the handler BEFORE the stroke
  // begins — so it is guarded rather than assumed always to succeed.
  try { el('surface').setPointerCapture?.(e.pointerId); } catch (err) { /* capture is an optimisation */ }
  const d = decideAdmission(e);
  if (e.pointerType === 'pen') notePenEvent(e.timeStamp);
  if (!d.admit) {
    // WHICH signal fired is recorded, not just that something was rejected. Without this the two
    // halves of the rule are indistinguishable in the summary, and a run cannot tell whether the
    // pen's proximity or the contact's width is what actually did the work.
    if (d.reason === 'pen-near') stats.palmRejectedByProximity++;
    else stats.palmRejectedByWidth++;
    flash('rejected: ' + d.reason);
    return;
  }
  if (e.pointerType === 'touch') stats.touchAdmitted++;
  beginStroke(e);
}, { passive: false });

// Hover is the signal that opens the palm gate. It is counted rather than assumed, because a
// device that never reports it would leave the gate permanently closed.
el('surface').addEventListener('pointermove', (e) => {
  if (!drawing && e.pointerType === 'pen') {
    stats.hoverSeen++;
    notePenEvent(e.timeStamp);
  }
  if (!drawing) return;
  e.preventDefault();
  current.events++;
  stats.rawEvents++;

  // The coalesced stream, when the browser admits to having one. `getCoalescedEvents` is absent or
  // broken on some builds — WebKit has an open bug about overlapping sequences — so its absence is
  // recorded as a finding rather than treated as a zero.
  let samples = [e];
  if (typeof e.getCoalescedEvents === 'function') {
    try {
      const c = e.getCoalescedEvents();
      if (c && c.length) { samples = c; }
    } catch (err) { stats.coalescedUnavailable = true; }
  } else {
    stats.coalescedUnavailable = true;
  }
  current.coalesced += samples.length;
  stats.coalescedEvents += samples.length;
  for (const s of samples) addSample(e, s);
  ctx.stroke();
  ctx.beginPath();
  const last = pointOf(samples[samples.length - 1]);
  ctx.moveTo(last.x, last.y);

  const kind = e.pointerType === 'pen' ? 'pen' : (e.pointerType === 'touch' ? 'touch' : 'mouse');
  if (kind === 'pen') { stats.penSamples += samples.length; notePenEvent(e.timeStamp); }
  else if (kind === 'touch') stats.touchSamples += samples.length;
  else stats.mouseSamples += samples.length;
}, { passive: false });

function endStroke(e) {
  if (!drawing) return;
  drawing = false;
  ctx.stroke();
  stats.strokes++;
  const sorted = stats.latencies.slice().sort((a, b) => a - b);
  const record = {
    v: 1, name: 'web.pen.stroke',
    pointerType: current.pointerType,
    samples: current.samples,
    rawEvents: current.events,
    coalescedPerEvent: current.events ? +(current.coalesced / current.events).toFixed(2) : 0,
    pressureDistinct: current.pressureDistinct.size,
    tiltDistinct: current.tiltDistinct.size,
    widths: Array.from(current.widths).slice(0, 12),
    durationMs: +(e.timeStamp - current.startMs).toFixed(1),
    paintLatencyP50Ms: pctOf(sorted, 50),
    paintLatencyP95Ms: pctOf(sorted, 95),
  };
  strokeLog.push(record);
  el('log').textContent = JSON.stringify(record) + '\n' + el('log').textContent;
  console.log(JSON.stringify(record));
  current = null;
  render();
}
el('surface').addEventListener('pointerup', endStroke);
el('surface').addEventListener('pointercancel', endStroke);

// One frame is one flush. Without this guard every pointermove would queue its own animation frame,
// and the painted timestamp the latency is measured against would belong to a frame that drew
// nothing.
let frameQueued = false;
window.addEventListener('pointermove', () => {
  if (frameQueued) return;
  frameQueued = true;
  requestAnimationFrame(() => { frameQueued = false; flushLatency(); });
});

function pctOf(sorted, p) { const v = percentile(sorted, p); return v === null ? null : +v.toFixed(1); }

let flashTimer = null;
function flash(text) {
  el('hint').textContent = text;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    el('hint').textContent =
      'Draw with the pen first, then with a finger. Rest a palm on the glass while drawing with the pen.';
  }, 1500);
}

function summary() {
  const sorted = stats.latencies.slice().sort((a, b) => a - b);
  const gaps = stats.penGaps.slice().sort((a, b) => a - b);
  const touchWidths = Array.from(stats.widthsSeenTouch.values()).sort((a, b) => a - b);
  const penWidths = Array.from(stats.widthsSeenPen.values()).sort((a, b) => a - b);
  return {
    v: 2, name: 'web.pen.summary',
    userAgent: navigator.userAgent,
    hardwareConcurrency: navigator.hardwareConcurrency,
    devicePixelRatio: devicePixelRatioSafe(),
    strokes: stats.strokes,
    samples: stats.samples,
    samplesPerStroke: stats.strokes ? +(stats.samples / stats.strokes).toFixed(1) : 0,
    coalescedPerEvent: stats.rawEvents ? +(stats.coalescedEvents / stats.rawEvents).toFixed(2) : 0,
    coalescedApiPresent: !stats.coalescedUnavailable,
    penSamples: stats.penSamples, touchSamples: stats.touchSamples, mouseSamples: stats.mouseSamples,
    penHoverEvents: stats.hoverSeen,
    distinctPressureValues: stats.pressureValues.size,
    distinctTiltValues: stats.tiltValues.size,
    touchWidthsSeen: touchWidths,
    penWidthsSeen: penWidths,

    // The palm rule: two signals, and each rejection says which one fired.
    palmRule: 'a non-pen contact is ignored when a pen was seen within the window, OR when its ' +
      'width is at or above the palm threshold',
    stylusProximityWindowMs: STYLUS_PROXIMITY_WINDOW_MS,
    palmWidthThresholdPx: PALM_WIDTH_PX,
    palmRejectedByProximity: stats.palmRejectedByProximity,
    palmRejectedByWidth: stats.palmRejectedByWidth,
    touchAdmitted: stats.touchAdmitted,
    penSeen: stats.penSeen,
    // THE WINDOW MUST BE CHOSEN FROM THESE, not guessed: it has to exceed the real pause between a
    // pen's own strokes, or the gate would open while the musician is still writing.
    penGapSamples: gaps.length,
    penGapP50Ms: pctOf(gaps, 50),
    penGapP95Ms: pctOf(gaps, 95),
    penGapP99Ms: pctOf(gaps, 99),
    penGapMaxMs: gaps.length ? +gaps[gaps.length - 1].toFixed(1) : null,

    paintLatencyP50Ms: pctOf(sorted, 50),
    paintLatencyP95Ms: pctOf(sorted, 95),
    paintLatencyMaxMs: sorted.length ? +sorted[sorted.length - 1].toFixed(1) : null,
    latencyIsLowerBound:
      'input timestamp to the end of the frame that drew it; the browser exposes no presentation time',
  };
}

el('copy').addEventListener('click', async () => {
  const text = JSON.stringify(summary(), null, 2);
  try { await navigator.clipboard.writeText(text); flash('summary copied'); }
  catch (err) { el('log').textContent = text + '\n' + el('log').textContent; flash('clipboard blocked — written to the log'); }
});
el('download').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(summary(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'web-pen-spike.json';
  a.click();
});
el('clear').addEventListener('click', () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stats.latencies = []; stats.strokes = 0; stats.samples = 0;
  stats.rawEvents = 0; stats.coalescedEvents = 0;
  stats.penSamples = 0; stats.touchSamples = 0; stats.mouseSamples = 0;
  stats.palmRejectedByProximity = 0; stats.palmRejectedByWidth = 0; stats.touchAdmitted = 0;
  stats.penSeen = 0; stats.penGaps = []; stats.hoverSeen = 0;
  stats.pressureValues = new Set(); stats.tiltValues = new Set();
  stats.widthsSeenTouch = new Set(); stats.widthsSeenPen = new Set();
  lastStylusSeenMs = -Infinity;
  strokeLog.length = 0;
  el('log').textContent = '';
  render();
});

resize();
observeSurface();
render();
el('log').textContent = 'ready — draw in the white area\n';
</script>
</body>
</html>
