# PURPOSE: Define one analyzer and linter policy for every ChartApp workspace member, so that
#          `dart analyze` means the same thing in the IDE, in a pre-commit hook and in CI.
# INPUTS: None. The analyzer discovers this file by walking up from each package directory;
#         packages do not carry their own options file.
# OUTPUTS: Strict type checking plus the lint set below. Any violation makes `dart analyze`
#          exit non-zero, which fails the `melos run analyze` step of `melos run verify`.
#          Packages that must break a rule in a justified place use a targeted
#          `// ignore: <rule>` comment with a reason, never a repository-wide exemption.
# KEYWORDS: analysis-options, lint, strict-casts, quality-gate, monorepo, dart-analyze
include: package:lints/recommended.yaml

analyzer:
  language:
    # Reject implicit downcasts, implicit `dynamic` inference and raw generic types. The chart
    # domain is numeric and positional (beats, bar indices, offsets); a silent dynamic here
    # becomes a wrong glyph on screen rather than a compile error, so it is worth the friction.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Promote to errors: these are wrong code, not style opinions.
    missing_required_param: error
    missing_return: error
    invalid_use_of_protected_member: error
    # Dead imports and dead locals are noise that hides real problems; keep them visible.
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
    # TODOs are allowed but must be countable in CI output.
    todo: info

  exclude:
    # Generated code is not reviewable and is regenerated by its generator.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/*.gr.dart"
    - "**/.dart_tool/**"
    - "**/build/**"

linter:
  rules:
    # --- Correctness ---------------------------------------------------------
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    collection_methods_unrelated_type: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unawaited_futures: true
    unrelated_type_equality_checks: true

    # --- API hygiene ---------------------------------------------------------
    avoid_print: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true
    unnecessary_parenthesis: true
    use_super_parameters: true

    # --- Formatting consistency (dart format owns whitespace; these own structure) ---
    prefer_single_quotes: true
    require_trailing_commas: true
    directives_ordering: true

    # --- Documentation -------------------------------------------------------
    # Public API members carry a doc comment. Phase 0 creates the package surfaces, so this
    # rule is what keeps the contract-first convention from eroding as the spikes land.
    public_member_api_docs: true
