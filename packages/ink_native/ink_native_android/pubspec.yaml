# PURPOSE: Declare ink_native_android — the Android half of the federated ink plugin, carrying
#          the Kotlin InkView scaffolding that will draw strokes from coalesced and predicted
#          motion events.
# INPUTS: None. Resolved as a member of the root pub workspace.
# OUTPUTS: A Flutter plugin whose native class InkNativeAndroidPlugin is registered on Android.
#          IMPORTANT: the Dart side of the ink contract is not implemented yet, so this package
#          does NOT satisfy InkNativePlatform and is not declared an implementation of ink_native.
# KEYWORDS: ink-native, android, inkview, kotlin, plugin, spike-s2, not-yet-implemented
name: ink_native_android
description: >-
  Android ink implementation scaffolding backed by a custom InkView. Native class registered;
  the Dart contract implementation lands with spike S2.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ink_native_platform_interface: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.chartapp.ink_native_android
        pluginClass: InkNativeAndroidPlugin

# Wiring note. The same three conditions as ink_native_ios apply before this package can be
# declared an implementation of ink_native: `implements: ink_native`, a `dartPluginClass`
# extending InkNativePlatform, and a dependency from the app-facing package. See the note in
# ink_native_ios/pubspec.yaml; the reasoning is identical and is not repeated here.
#
# One Android-specific decision is still open and belongs to spike S2: whether the ink surface
# reaches Dart through a PlatformView using Hybrid Composition, which is what the design calls
# for, or through a Texture. Hybrid Composition is the design's choice because it gives the
# native view the real input stream it needs for predicted events; either way the Dart-side
# contract is unchanged, which is the point of fixing it now.
