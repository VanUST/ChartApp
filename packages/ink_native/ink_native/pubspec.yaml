# PURPOSE: Declare ink_native — the app-facing half of the federated ink plugin. The app
#          imports this package and never a platform package, so which native engine draws a
#          stroke stays an implementation detail and the app builds unchanged on every target.
# INPUTS: None. Resolved as a member of the root pub workspace.
# OUTPUTS: A Flutter package that re-exports the platform contract, routes Android builds to
#          ink_native_android through `default_package`, and installs a no-op implementation on
#          platforms with no native ink surface.
# KEYWORDS: federated-plugin, app-facing, ink-native, desktop-fallback, graceful-degradation
name: ink_native
description: >-
  App-facing ink plugin. Re-exports the platform contract and installs a no-op implementation
  where no native ink surface exists, so a desktop build degrades instead of crashing.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ink_native_android: any
  ink_native_platform_interface: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      # `default_package` is what routes an Android build to the Kotlin surface while the app keeps
      # importing only this package. iOS has no entry yet: ink_native_ios is still scaffolding, and
      # declaring it here would promise a contract it does not keep (see its pubspec).
      android:
        default_package: ink_native_android

# The iOS platform package is deliberately NOT a dependency yet. A federated implementation is
# declared through `implements:` and a `default_package` entry, which promises that the package
# actually satisfies the contract. ink_native_ios still carries only the Swift/PencilKit
# scaffolding that `flutter create` produced, so declaring it would be a claim that is not true.
#
# Android is declared, in the same change that made the claim true: ink_native_android now extends
# InkNativePlatform and is routed to by default here. The consequence on iOS is stated plainly so
# it is not mistaken for a bug: an iOS build still resolves to the same no-op used on desktop.
