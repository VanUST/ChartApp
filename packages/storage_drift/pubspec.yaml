# PURPOSE: Declare storage_drift — the persistence boundary. It owns the SQLite schema, the
#          drift database class, the repositories and the migrations, and it is the only package
#          allowed to open a database, so the rest of the system can be tested against in-memory
#          databases instead of a real file.
# INPUTS: None. Resolved as a member of the root pub workspace.
# OUTPUTS: A PURE-DART package: no Flutter, no platform channels.
# KEYWORDS: storage, drift, sqlite, repositories, migrations, op-log, pure-dart, cold-open
name: storage_drift
description: >-
  SQLite persistence for ChartApp via drift: schema, repositories and migrations for documents,
  the event log, ink blobs, setlists and metadata. Pure Dart; the caller supplies the file path.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  chart_core: any
  drift: ^2.35.2
  path: ^1.9.1
  sqlite3: ^3.7.0

dev_dependencies:
  # Pinned exactly, and NOT the newest release. Three packages in this workspace constrain the
  # analyzer, and only one window satisfies all of them:
  #
  #   test 1.31.1    -> test_core 0.6.18 -> analyzer >=8.0.0 <14.0.0   (pinned; see below)
  #   build_runner   -> analyzer >=8.0.0 <14.0.0 for 2.15.1; 2.16.2 demands ^14.3.0
  #   drift_dev      -> analyzer >=13.0.0 <15.0.0
  #
  # The intersection is analyzer 13.x. build_runner 2.16.2 forces analyzer 14, which the test
  # pin cannot accept, so 2.15.1 is the newest build_runner this workspace can resolve.
  build_runner: 2.15.1
  drift_dev: ^2.35.1
  lints: ^6.1.0
  # Pinned exactly; see the longer note in packages/chart_core/pubspec.yaml. flutter_test in
  # Flutter 3.47.7 requires test_api 0.7.12 exactly, and only test 1.31.1 declares that same pin.
  test: 1.31.1

# WHY THIS PACKAGE IS PURE DART, when the design's architecture diagram groups it with the
# infrastructure that the Flutter app owns.
#
# The design sets a cold-open budget of 1000 ms at p95 and assigns the measurement to spike S5.
# A package that depends on the Flutter SDK cannot be exercised by `dart run` or `dart test`,
# because dart:ui is not available outside a Flutter engine — so the spike could not take its own
# measurement without a device, and the budget would stay unverified until hardware was available.
#
# drift does not require Flutter. `NativeDatabase` opens a file directly, and the path is an
# ordinary Dart value, so the only thing the app has to supply is where to put the file (which it
# obtains from path_provider). That keeps the measurement on the same machine as the rest of the
# test suite, and it keeps every test in this package free of a widget binding.
#
# NATIVE SQLITE BUNDLING is likewise not declared here, and deliberately. The obvious package,
# sqlite3_flutter_libs, is end-of-life: pub.dev serves 0.6.0+eol whose own description reads "Not
# used anymore, update to version 3.x of package:sqlite3 instead". `sqlite3` 3.7.0 bundles the
# native library itself through Dart build hooks — verified on this machine, where the first run
# printed "Running build hooks..." and then answered a query against SQLite 3.53.4. `drift_flutter`
# still pulls the EOL packages transitively, so it is not used either; the app will open the
# database through this package instead.
